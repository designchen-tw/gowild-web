<!-- GO WILD menu. Paste the entire file into a Code Embed inside .mobile-overlay.gw > .menu-icon-items-section. Keep Finsweet's fs-scrolldisable-element="when-visible" on the outer .mobile-overlay.gw element. -->
<style>
  @font-face{font-family:"GW Avenir";src:url("https://cdn.prod.website-files.com/6abb59dcfe815aa0c010d5c6/6abb59dcfe815aa0c010d666_Avenir%20LT%20Std%2045%20Book.otf") format("opentype");font-weight:400;font-display:swap}
  @font-face{font-family:"GW Avenir";src:url("https://cdn.prod.website-files.com/6abb59dcfe815aa0c010d5c6/6abb59dcfe815aa0c010d669_Avenir%20LT%20Std%2065%20Medium.otf") format("opentype");font-weight:600;font-display:swap}
  .mobile-overlay.gw{overflow:hidden;overscroll-behavior:none}
  .mobile-overlay.gw .menu-icon-items-section{width:100%;min-height:100%;height:auto;overflow:visible;border-bottom:0!important}
  .gw-menu-shell,.gw-menu-shell *{box-sizing:border-box}
  .gw-menu-shell{display:flex;align-items:center;justify-content:center;width:100%;min-height:100svh;padding:clamp(145px,18vh,210px) 20px calc(26px + env(safe-area-inset-bottom));color:rgba(255,255,255,.66);font-family:"GW Avenir",Arial,sans-serif;font-weight:400;line-height:1.4;text-align:center}
  .gw-menu-panel{width:min(100%,360px);margin:auto}
  .gw-menu-shell a,.gw-menu-shell button{font-family:inherit;color:inherit;text-decoration:none}
  .gw-menu-shell a:focus-visible,.gw-menu-shell button:focus-visible{outline:2px solid #fff;outline-offset:6px;border-radius:3px}
  .gw-menu-brand{display:inline-block;margin:0 0 30px;padding:6px;color:inherit;font-size:14px;font-weight:600;letter-spacing:.035em;white-space:nowrap;transition:color .2s}
  .gw-menu-brand:hover{color:rgba(255,255,255,.88)}
  .gw-menu-line{width:min(100%,190px);height:1px;border:0;margin:0 auto;background:rgba(255,255,255,.24)}
  .gw-menu-groups{padding:34px 0 30px}
  .gw-menu-group{width:100%;margin:0}
  .gw-menu-group+ .gw-menu-group{margin-top:22px}
  .gw-menu-toggle{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;min-height:48px;padding:4px 8px;border:0;background:transparent;appearance:none;-webkit-appearance:none;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:.035em;line-height:1.4;text-align:center;user-select:none;-webkit-tap-highlight-color:transparent;transition:color .25s ease}
  .gw-menu-toggle:hover,.gw-menu-group.is-open .gw-menu-toggle{color:rgba(255,255,255,.88)}
  .gw-menu-chevron{width:13px;height:13px;flex:none;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-3px) rotate(45deg);transition:transform .35s cubic-bezier(.22,1,.36,1)}
  .gw-menu-group.is-open .gw-menu-chevron{transform:translateY(3px) rotate(225deg)}
  .gw-menu-dropdown{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.22,1,.36,1)}
  .gw-menu-dropdown-inner{min-height:0;overflow:hidden}
  .gw-menu-group.is-open .gw-menu-dropdown{grid-template-rows:1fr}
  .gw-menu-submenu{display:grid;gap:2px;margin:8px auto 6px;padding:10px 12px;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.055);box-shadow:0 8px 22px rgba(0,0,0,.07);opacity:0;transform:translateY(-7px);transition:opacity .23s ease,transform .38s cubic-bezier(.22,1,.36,1)}
  .gw-menu-group.is-open .gw-menu-submenu{opacity:1;transform:translateY(0);transition-delay:.07s}
  .gw-menu-submenu a{display:block;padding:9px 8px;border-radius:7px;color:rgba(255,255,255,.66);font-size:14px;line-height:1.5;transition:background .2s,color .2s}
  .gw-menu-submenu a:hover,.gw-menu-submenu a[aria-current="page"]{background:rgba(255,255,255,.1);color:rgba(255,255,255,.88)}
  .gw-menu-social{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;margin-top:25px;border-radius:50%;color:inherit;transition:background .2s}
  .gw-menu-social:hover{background:rgba(255,255,255,.13)}
  .gw-menu-social img{display:block;width:39px;height:39px;object-fit:contain;filter:grayscale(1) brightness(0) invert(1);opacity:.66;transition:opacity .2s}
  .gw-menu-social:hover img{opacity:.9}
  @media(max-width:600px){
    .gw-menu-shell{min-height:100svh;padding:160px 24px calc(20px + env(safe-area-inset-bottom))}
    .gw-menu-panel{width:min(100%,320px)}
    .gw-menu-brand,.gw-menu-toggle{font-size:12px}
    .gw-menu-brand{margin:0 0 25px}
    .gw-menu-groups{padding:20px 0 18px}
    .gw-menu-group+.gw-menu-group{margin-top:12px}
    .gw-menu-toggle{min-height:44px;gap:12px}
    .gw-menu-line{width:min(100%,160px)}
    .gw-menu-chevron{width:10px;height:10px}
    .gw-menu-submenu{margin:5px auto 3px;padding:7px 9px}
    .gw-menu-submenu a{font-size:12px;padding:8px}
    .gw-menu-social{width:48px;height:48px;margin-top:16px}
    .gw-menu-social img{width:32px;height:32px}
  }
  @media(max-height:660px){.gw-menu-shell{padding-top:90px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}.gw-menu-brand{margin-bottom:20px}.gw-menu-groups{padding-top:16px;padding-bottom:14px}.gw-menu-group+.gw-menu-group{margin-top:6px}.gw-menu-social{margin-top:12px}}
  @media(max-height:560px){.mobile-overlay.gw{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.gw-menu-shell{padding-top:55px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}}
  @media(prefers-reduced-motion:reduce){.gw-menu-shell *{transition:none!important}}
  /* Standalone preview only. These elements are created when Webflow's overlay is absent. */
  .gw-menu-preview{min-height:100svh;background:#000;color:#fff;font-family:"GW Avenir",Arial,sans-serif}
  .gw-menu-preview__stage{display:grid;place-content:center;min-height:100svh;padding:30px;text-align:center}
  .gw-menu-preview__stage strong{font-size:clamp(36px,6vw,72px);letter-spacing:.08em}
  .gw-menu-preview__stage span{margin-top:14px;color:#aaa;font-size:14px}
  .gw-menu-preview__button{position:fixed;top:calc(18px + env(safe-area-inset-top));right:20px;z-index:10002;width:52px;height:52px;border:1px solid rgba(255,255,255,.4);border-radius:50%;background:rgba(24,24,24,.8);color:#fff;font-size:25px;cursor:pointer}
  .gw-menu-preview__overlay.mobile-overlay.gw{position:fixed;inset:0;z-index:10001;display:none;background:#646464}
  .gw-menu-preview__overlay .menu-icon-items-section{width:100%;min-height:100%}
</style>

<div class="gw-menu-shell" data-gw-full-menu>
  <nav class="gw-menu-panel" aria-label="網站主選單">
    <a class="gw-menu-brand" href="/">GO WILD | 夠野戶外</a>
    <hr class="gw-menu-line">

    <div class="gw-menu-groups">
      <div class="gw-menu-group" data-gw-section="discover">
        <button class="gw-menu-toggle" type="button" aria-expanded="false" aria-controls="gw-menu-discover">發現 DISCOVER <span class="gw-menu-chevron" aria-hidden="true"></span></button>
        <div class="gw-menu-dropdown" id="gw-menu-discover" aria-hidden="true" inert><div class="gw-menu-dropdown-inner"><div class="gw-menu-submenu">
          <a href="/longdong">龍洞 Long Dong</a>
          <a href="/kenting">墾丁 Kenting</a>
          <a href="/defulan">德芙蘭 Defulan</a>
        </div></div></div>
      </div>
      <div class="gw-menu-group" data-gw-section="learn">
        <button class="gw-menu-toggle" type="button" aria-expanded="false" aria-controls="gw-menu-learn">學習 LEARN <span class="gw-menu-chevron" aria-hidden="true"></span></button>
        <div class="gw-menu-dropdown" id="gw-menu-learn" aria-hidden="true" inert><div class="gw-menu-dropdown-inner"><div class="gw-menu-submenu">
          <a href="/multi-pitch">多繩距攀登課程 Multi-pitch Climbing</a>
          <a href="/rock-rescue-skill">繩索操作與救援技術 Rope Rescue</a>
        </div></div></div>
      </div>
      <div class="gw-menu-group" data-gw-section="explore">
        <button class="gw-menu-toggle" type="button" aria-expanded="false" aria-controls="gw-menu-explore">探索 EXPLORE <span class="gw-menu-chevron" aria-hidden="true"></span></button>
        <div class="gw-menu-dropdown" id="gw-menu-explore" aria-hidden="true" inert><div class="gw-menu-dropdown-inner"><div class="gw-menu-submenu">
          <a href="/longdong">人物誌 Stories</a>
          <a href="/photography">岩壁攝影 Photography</a>
        </div></div></div>
      </div>
    </div>

    <hr class="gw-menu-line">
    <a class="gw-menu-social" href="https://www.instagram.com/gowild.one/" target="_blank" rel="noopener noreferrer" aria-label="GO WILD Instagram">
      <img src="https://cdn.prod.website-files.com/6abb59dcfe815aa0c010d5c6/6abb59dcfe815aa0c010d8e5_665547b96567370152391109_icon-instagram.png" alt="">
    </a>
  </nav>
</div>

<script>
(function(){
  function init(){
    var shell=document.querySelector('[data-gw-full-menu]');
    if(!shell||shell.dataset.gwReady)return;
    shell.dataset.gwReady='1';
    var overlay=shell.closest('.mobile-overlay.gw');
    var previewButton=null;

    if(!overlay){
      var preview=document.createElement('div');
      preview.className='gw-menu-preview';
      preview.innerHTML='<div class="gw-menu-preview__stage"><strong>GO WILD</strong><span>點選右上角，預覽選單</span></div><button class="gw-menu-preview__button" type="button" aria-label="開啟選單" aria-expanded="false">☰</button><div class="gw-menu-preview__overlay mobile-overlay gw"><section class="menu-icon-items-section"></section></div>';
      document.body.appendChild(preview);
      overlay=preview.querySelector('.gw-menu-preview__overlay');
      overlay.querySelector('.menu-icon-items-section').appendChild(shell);
      previewButton=preview.querySelector('.gw-menu-preview__button');
      previewButton.addEventListener('click',function(){
        var opening=getComputedStyle(overlay).display==='none';
        overlay.style.display=opening?'block':'none';
        previewButton.textContent=opening?'×':'☰';
        previewButton.setAttribute('aria-label',opening?'關閉選單':'開啟選單');
        previewButton.setAttribute('aria-expanded',String(opening));
      });
    }

    var groups=Array.prototype.slice.call(shell.querySelectorAll('[data-gw-section]'));
    function setGroup(group,open){
      var button=group.querySelector('.gw-menu-toggle');
      var dropdown=group.querySelector('.gw-menu-dropdown');
      group.classList.toggle('is-open',open);
      button.setAttribute('aria-expanded',String(open));
      dropdown.setAttribute('aria-hidden',String(!open));
      if(open)dropdown.removeAttribute('inert');
      else dropdown.setAttribute('inert','');
    }
    groups.forEach(function(group){
      group.querySelector('.gw-menu-toggle').addEventListener('click',function(){
        var opening=!group.classList.contains('is-open');
        groups.forEach(function(other){setGroup(other,other===group&&opening)});
      });
    });

    function currentSection(){
      var path=location.pathname.replace(/\/+$/,'')||'/';
      if(path==='/multi-pitch'||path==='/rock-rescue-skill')return 'learn';
      if(path==='/photography')return 'explore';
      if(path==='/longdong'||path==='/kenting'||path==='/defulan')return 'discover';
      if(path==='/'){
        if(location.hash==='#ld-learn')return 'learn';
        if(location.hash==='#ld-explore')return 'explore';
        if(location.hash==='#ld-discover')return 'discover';
      }
      return null;
    }
    function setActive(){
      var path=location.pathname.replace(/\/+$/,'')||'/';
      var section=currentSection();
      if(path==='/')shell.querySelector('.gw-menu-brand').setAttribute('aria-current','page');
      else shell.querySelector('.gw-menu-brand').removeAttribute('aria-current');
      groups.forEach(function(group){
        Array.prototype.forEach.call(group.querySelectorAll('a[href^="/"]'),function(link){
          var linkPath=link.getAttribute('href').replace(/\/+$/,'')||'/';
          if(path!=='/'&&linkPath===path&&group.getAttribute('data-gw-section')===section)link.setAttribute('aria-current','page');
          else link.removeAttribute('aria-current');
        });
      });
    }
    var wasOpen=false;
    function sync(){
      var isOpen=getComputedStyle(overlay).display!=='none'&&getComputedStyle(overlay).visibility!=='hidden';
      if(isOpen&&!wasOpen){
        groups.forEach(function(group){setGroup(group,false)});
        requestAnimationFrame(setActive);
      }
      wasOpen=isOpen;
    }
    new MutationObserver(sync).observe(overlay,{attributes:true,attributeFilter:['style','class','aria-hidden']});
    window.addEventListener('hashchange',function(){if(wasOpen)setActive()});
    sync();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
