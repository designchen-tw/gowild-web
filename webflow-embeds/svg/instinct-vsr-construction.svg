      .sr-shoe-st1, .sr-shoe-st2, .sr-shoe-st17, .sr-shoe-st18, .sr-shoe-st13, .sr-shoe-st19, .sr-shoe-st14, .sr-shoe-st5, .sr-shoe-st20, .sr-shoe-st7, .sr-shoe-st10, .sr-shoe-st21, .sr-shoe-st22, .sr-shoe-st11, .sr-shoe-st23 {
