<svg xmlns="http://www.w3.org/2000/svg" id="Layer_1" version="1.1" viewBox="0 0 640 820" class="sr-shoe-svg" role="img" aria-labelledby="shoe-title shoe-desc">
  
  <title id="shoe-title">攀岩鞋結構與成形示意 / Climbing shoe construction</title><desc id="shoe-desc">以 Instinct VSR 外型說明鞋楦、鞋面、包邊、中底與外底；結構與分層為製程示意。</desc><defs>
