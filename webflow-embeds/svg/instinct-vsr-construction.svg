        fill: var(--shoe-tool);
        fill-opacity: .1;
      }

      .sr-shoe-st19, .sr-shoe-st5 {
        stroke-dasharray: 5 5;
      }

      .sr-shoe-st14 {
        opacity: .3;
        stroke-width: .8px;
      }

      .sr-shoe-st6 {
        stroke-dasharray: 3 4;
        stroke-width: 1.2px;
      }

      .sr-shoe-st6, .sr-shoe-st24 {
        opacity: .7;
      }

      .sr-shoe-st6, .sr-shoe-st8, .sr-shoe-st9, .sr-shoe-st15 {
        stroke: var(--shoe-light);
      }

      .sr-shoe-st20 {
        fill: var(--shoe-dark);
      }

      .sr-shoe-st10 {
        opacity: .4;
        stroke-dasharray: 3 7;
      }

      .sr-shoe-st21 {
        fill: url(#shoe-core);
      }

      .sr-shoe-st22 {
        fill: var(--shoe-blue);
      }

      .sr-shoe-st11 {
        stroke-width: 1.2px;
      }

      .sr-shoe-st25 {
        fill: var(--shoe-light);
      }

      .sr-shoe-st23 {
        fill: var(--shoe-mid);
      }
    
.sr-shoe-svg{--shoe-line:#b5bcba;--shoe-panel:#1e2527;--shoe-dark:#101719;--shoe-mid:#2a3235;--shoe-blue:#407f96;--shoe-light:#6faec1;--shoe-tool:#78837e;--shoe-label:#b5bcba;font-family:"GW Resole Avenir","PingFang TC",sans-serif}.sr-shoe-svg .sr-shoe-st12{font-family:inherit}.sr-shoe-svg [lang="en"]{display:none}
</style>
