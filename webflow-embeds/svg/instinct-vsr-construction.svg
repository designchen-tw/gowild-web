      }

      .sr-shoe-st1, .sr-shoe-st9 {
        opacity: .4;
      }

      .sr-shoe-st2, .sr-shoe-st15 {
        opacity: .5;
      }

      .sr-shoe-st17, .sr-shoe-st15 {
        fill: var(--shoe-panel);
      }

      .sr-shoe-st3 {
        stroke-width: 5px;
      }

      .sr-shoe-st3, .sr-shoe-st4 {
        stroke: var(--shoe-mid);
      }

      .sr-shoe-st4 {
        stroke-width: 4px;
      }

